<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Wishfall</title>

<style>
html,body{color-scheme:dark;margin:0;height:100%;background:#04060f;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:absolute;left:0;top:0;width:390px;height:844px;transform-origin:0 0;overflow:hidden;background:#04060f}
#bg{position:absolute;left:0;top:0;width:390px;height:100%;display:block;opacity:0;transition:opacity .9s ease;z-index:0}
#bg.on{opacity:1}
iframe{position:absolute;left:0;top:0;width:390px;height:100%;border:0;background:transparent;display:block}
.tabf{opacity:0;visibility:hidden;transition:opacity .2s ease;z-index:1}
.tabf.on{opacity:1;visibility:visible;z-index:2}
.tabf.leave{opacity:0;visibility:visible;z-index:1}
.tabf.hid{visibility:hidden!important}
.ovw{position:absolute;left:0;top:0;width:390px;height:100%;transform:translateX(100%);transition:transform .34s cubic-bezier(.22,1,.36,1);box-shadow:-18px 0 40px rgba(0,0,0,.45);visibility:hidden;will-change:transform}
.ovw.in{transform:none;visibility:visible}
.ovw.hid{visibility:hidden!important}
.ovb{position:absolute;left:0;top:0;width:100%;height:100%;background:#04060f;transition:opacity .3s ease}
.under{transition:transform .34s cubic-bezier(.22,1,.36,1)!important;transform:translateX(-16%)!important}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:9;transition:opacity .34s ease}
#cover{position:absolute;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 38%,#0a1026 0%,#04060f 62%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s ease;pointer-events:all;overflow:hidden}
#cover.off{opacity:0;pointer-events:none}
#cover .wm{font-family:'Outfit',sans-serif;font-weight:300;font-size:40px;letter-spacing:.34em;text-indent:.34em;color:#fff;opacity:0;filter:blur(8px);animation:wmIn 1.2s .25s cubic-bezier(.22,1,.36,1) forwards;text-shadow:0 0 28px rgba(160,190,255,.35)}
#cover .tg{font-family:'Outfit',sans-serif;font-weight:300;font-size:13px;letter-spacing:.22em;text-indent:.22em;text-transform:uppercase;color:rgba(214,226,255,.62);margin-top:14px;opacity:0;animation:tgIn 1s .95s ease forwards}
#cover .st{position:absolute;left:-10%;top:30%;width:120px;height:1.5px;border-radius:2px;background:linear-gradient(90deg,rgba(207,219,255,0),rgba(235,242,255,.95));transform:rotate(24deg);opacity:0;animation:fall 1.3s .15s cubic-bezier(.4,0,.2,1) forwards}
#cover .ds{position:absolute;width:2px;height:2px;border-radius:1px;background:#cfdbff;opacity:0;animation:tw 2.4s ease-in-out infinite}
#cover.off .wm{transform:scale(1.06);transition:transform .6s ease}
@keyframes wmIn{to{opacity:1;filter:blur(0)}}
@keyframes tgIn{to{opacity:1}}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(24deg)}15%{opacity:1}100%{opacity:0;transform:translate(560px,250px) rotate(24deg)}}
@keyframes tw{0%,100%{opacity:0}50%{opacity:.8}}
</style>
</head>
<body>
<div id="stage">

<script>
