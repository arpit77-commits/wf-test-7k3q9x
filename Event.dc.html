<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Event detail</title>
<style>html,body{margin:0;background:#04060f}</style>
<script src="./bridge.js"></script>
<script src="./support.js"></script>
<script src="./a/wishfall-ui6.js"></script>
<script src="./a/three.min.js"></script>
<script src="./a/astronomy.browser.min.js"></script>
<script src="./a/wishfall-astro3.js"></script>
<script src="./a/wishfall-moon4.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="./outfit.css" rel="stylesheet">
</helmet>
<div class="wf-page" data-nav="{{navDir}}" style="position:relative;width:390px;height:844px;overflow:hidden;background:var(--wf-space);color:var(--wf-ink-1);font-family:'Outfit',sans-serif">


<canvas id="spacecv_event" class="bgfade" aria-hidden="true" style="position:absolute;left:0;top:0;width:390px;height:844px;display:block"></canvas>
<div style="position:absolute;left:0;top:0;width:390px;height:844px;background:linear-gradient(180deg,rgba(3,4,11,.2) 0%,rgba(3,4,11,.45) 60%,rgba(3,4,11,.72) 100%)"></div>

<div class="wf-body" style="position:absolute;left:0;top:0;width:390px;height:844px">

<sc-if value="{{backMain}}" hint-placeholder-val="{{true}}"><a class="fg press btn-ic rise" href="Main.dc.html" onClick="{{goBack}}" aria-label="Back" style="--i:0;position:absolute;left:24px;top:24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if><sc-if value="{{backEvents}}" hint-placeholder-val="{{false}}"><a class="fg press btn-ic rise" href="Events.dc.html" onClick="{{goBack}}" aria-label="Back" style="--i:0;position:absolute;left:24px;top:24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if><sc-if value="{{backAlerts}}" hint-placeholder-val="{{false}}"><a class="fg press btn-ic rise" href="Alerts.dc.html" onClick="{{goBack}}" aria-label="Back" style="--i:0;position:absolute;left:24px;top:24px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if>

<div class="floaty" style="position:absolute;left:270px;top:24px;width:96px;height:96px">
<div class="halo" style="position:absolute;left:-30px;top:-30px;width:156px;height:156px;border-radius:78px"></div>
<span class="moon-in" style="position:absolute;left:0;top:0;width:96px;height:96px"><canvas id="mooncv_event" class="bgfade" aria-label="The Moon at this hour" style="width:96px;height:96px;display:block"></canvas></span>
</div>

<div class="rise" style="--i:1;position:absolute;left:24px;top:104px;right:128px;display:flex;flex-direction:column;align-items:flex-start;min-width:0">
<span class="t-eyebrow i2">Meteor shower</span>
<span class="t-hero nw" style="margin-top:8px">{{name}}</span>
<span class="t-body i2 nw" style="margin-top:4px">{{when}}</span>
</div>
<div class="fg chip rise" style="--i:2;position:absolute;left:24px;top:206px;max-width:342px">
<span class="dot" style="color:{{tone}}"></span>
<span>{{verdict}} · {{score}}/100 · {{verdictWords}}</span>
</div>

<!-- arc card -->
<div class="fg rise" style="--i:3;position:absolute;left:24px;right:24px;top:254px;padding:16px;border-radius:var(--wf-r-hero);display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;align-items:flex-end;height:64px">
<div style="display:flex;flex-direction:column"><span class="t-label i2">Pick a time</span><span class="t-big nw">{{timeLabel}}</span></div>
<div style="display:flex;flex-direction:column;align-items:flex-end"><span class="t-label i2 nw">Shooting stars you may see</span><span class="t-h2" style="line-height:24px">{{rate}} <span class="t-cap i2" style="font-weight:300">an hour</span></span></div>
</div>
<svg width="310" height="104" viewBox="0 0 310 104" role="img" aria-label="How high the meteor starting point climbs through the night" style="display:block;overflow:visible">
<defs><linearGradient id="fillg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfdbff" stop-opacity=".28"/><stop offset="1" stop-color="#cfdbff" stop-opacity="0"/></linearGradient></defs>
<line x1="0" y1="88" x2="310" y2="88" stroke="rgba(255,255,255,.2)" stroke-width="1"/>
<path d="{{areaPath}}" fill="url(#fillg)"/>
<path d="{{arcPath}}" fill="none" stroke="#e6edff" stroke-width="2.5" stroke-linecap="round"/>
<g style="{{dotG}}"><line x1="0" y1="0" x2="0" y2="-88" stroke="rgba(255,255,255,.35)" stroke-dasharray="2 4" style="{{dotLine}}"/></g>
<g style="{{dotC}}"><circle class="ping" r="15" fill="rgba(200,215,255,.3)"/><circle r="7" fill="#fff"/></g>
</svg>
<div style="position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));column-gap:6px">
<span style="{{pillStyle}}"></span>
<sc-for list="{{hours}}" as="h" hint-placeholder-count="6">
<button class="press" onClick="{{h.pick}}" aria-pressed="{{h.on}}" style="{{h.style}}">{{h.label}}</button>
</sc-for>
</div>
</div>

<!-- tiles -->
<div class="rise" style="--i:4;position:absolute;left:24px;right:24px;top:534px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:12px">
<div class="fg tile" style="height:72px"><div class="t-label i3 nw">{{t1l}}</div><div class="t-value nw">{{t1v}}</div></div>
<div class="fg tile" style="height:72px"><div class="t-label i3">Look</div><div class="t-value nw">{{t2v}}</div></div>
<div class="fg tile" style="height:72px"><div class="t-label i3">Height</div><div class="t-value nw">{{t3v}}</div></div>
</div>

<!-- why -->
<div class="fg rise" style="--i:5;position:absolute;left:24px;right:24px;top:618px;min-height:96px;padding:14px 16px;border-radius:var(--wf-r-card)">
<div class="t-eyebrow i2" style="letter-spacing:.14em">Why this score</div>
<div class="t-small i1" style="margin-top:4px">{{why}}</div>
</div>

<!-- plan -->
<button class="press cta rise" onClick="{{togglePlan}}" style="{{planStyle}}">
<sc-if value="{{planned}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
<span>Alert set for {{alertDay}}, {{hourTxt}}</span>
</sc-if>
<sc-if value="{{notPlanned}}" hint-placeholder-val="{{true}}">
<span>Plan this night</span>
</sc-if>
</button>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let id = 'gem';
    try { const v = localStorage.getItem('wf_event'); if (v) id = v; } catch (e) {}
    this.state = { id: id, nav: window.WFUI ? window.WFUI.nav() : 'cold', t: null, planned: (window.WFUI ? window.WFUI.hasPlan(id) : false), obs: { lat: 26.9124, lon: 75.7873, name: 'Jaipur' } };
    this.space = null; this.moonR = null;
  }
  componentDidMount() {
    const boot = () => {
      if (!window.THREE || !window.WishfallSky || !window.WishfallMoon || !window.WF || !window.Astronomy) { this.retry = setTimeout(boot, 300); return; }
      const cv = document.getElementById('spacecv_event'), mc = document.getElementById('mooncv_event');
      if (!cv || !mc) { this.retry = setTimeout(boot, 300); return; }
      const o = this.state.obs;
      this.space = window.WishfallSky.create({ canvas: cv, texUrl: './a/mw_eq_clean4.jpg', mode: 'bg', interactive: false, az: 150, alt: 55, fov: 70, sid: 140, gain: 1.7, starScale: 1.2, lat: o.lat, lon: o.lon });
      this.moonR = window.WishfallMoon.create({ canvas: mc, texUrl: './a/c_moon_disc.jpg', texW: 1536 });
      this.pushMoon();
      setTimeout(() => { cv.classList.add('on'); mc.classList.add('on'); }, 120);
      window.WF.getObserver((ob) => { this.setState({ obs: ob }); if (this.space) this.space.relocate(ob.lat, ob.lon); setTimeout(() => this.pushMoon(), 0); });
    };
    boot();
  }
  componentWillUnmount() { clearTimeout(this.retry); if (this.space) this.space.dispose(); }
  data() {
    const WF = window.WF; if (!WF || !window.Astronomy) return null;
    const sh = WF.SHOWERS.filter((x) => x.id === this.state.id)[0] || WF.SHOWERS[2];
    return WF.evalShower(sh, this.state.obs, new Date());
  }
  bk() { return window.WFUI ? window.WFUI.back() : 'Main.dc.html'; }
  tIdx(d) { if (this.state.t != null) return this.state.t; let bi = 0; d.nightSamples.forEach((x, i) => { if (x.rate > d.nightSamples[bi].rate) bi = i; }); return Math.max(0, Math.min(5, Math.round(bi / 4))); }
  pushMoon() {
    const d = this.data(); if (!d || !this.moonR) return;
    const s = d.nightSamples[Math.min(20, this.tIdx(d) * 4)];
    const m = window.WF.moonToday(this.state.obs, s.d);
    this.moonR.set(m.L, m.rot);
  }
  renderVals() {
    const p = this.state.planned;
    const labels = ['8 pm', '10 pm', '12 am', '2 am', '4 am', '6 am'];
    const d = this.data();
    const abbr = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
    const ab = (az) => abbr[Math.round((((az % 360) + 360) % 360) / 22.5) % 16];
    const base = { navDir: this.state.nav, goBack: () => { if (window.WFUI) window.WFUI.mark('back', 'event'); }, backMain: this.bk() === 'Main.dc.html', backEvents: this.bk() === 'Events.dc.html', backAlerts: this.bk() === 'Alerts.dc.html', hourTxt: window.WFUI ? window.WFUI.hourText(window.WFUI.prefs().hour) : '7 pm', togglePlan: () => { if (window.WFUI) window.WFUI.togglePlan(this.state.id); this.setState({ planned: !p }); }, planned: p, notPlanned: !p,
      planStyle: '--i:6;box-sizing:border-box;position:absolute;left:24px;right:24px;bottom:24px;transition:all .45s var(--ease-out), transform .25s var(--ease-spring);' + (p ? 'color:var(--wf-ink-1);border:1px solid rgba(255,255,255,.3);background:rgba(18,20,30,.5);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)' : 'color:var(--wf-select-ink);border:0;background:var(--wf-select);box-shadow:0 0 36px rgba(190,205,255,.3)') };
    if (!d) return Object.assign(base, { name: 'Meteor shower', when: '', verdict: '', score: '', verdictWords: '', tone: '#fff', timeLabel: labels[t], rate: 0, arcPath: '', areaPath: '', dotG: '', dotLine: '', dotC: '', pillStyle: '', hours: [], hourTxt: '7 pm', backMain: true, backEvents: false, backAlerts: false, t1l: 'Moon', t1v: '', t2v: '', t3v: '', why: '', alertDay: '' });
    const t = this.tIdx(d);
    const idx = (i) => Math.min(20, i * 4);
    const S = d.nightSamples;
    const X = (i) => 23.3 + i * 52.67;
    const Y = (a) => 88 - Math.max(0, a) * 0.8;
    const alt = labels.map((_, i) => S[idx(i)].radAlt);
    let path = 'M' + X(0) + ' ' + Y(alt[0]);
    for (let i = 1; i < 6; i++) { const mx = (X(i - 1) + X(i)) / 2; path += ' C' + mx + ' ' + Y(alt[i - 1]) + ' ' + mx + ' ' + Y(alt[i]) + ' ' + X(i) + ' ' + Y(alt[i]); }
    const cur = S[idx(t)];
    const tone = { Go: '#7ee7c7', Maybe: '#ffc46b', Skip: '#ff8f9c' }[d.verdict];
    const words = { Go: "Don't miss this one", Maybe: 'Worth a try', Skip: 'Better to skip' }[d.verdict];
    const moonPart = d.best.moonUp ? 'Best at ' + d.bestTime + '. The Moon is ' + Math.round(d.best.ill * 100) + '% lit then, which hides the faint ones.' : 'Best at ' + d.bestTime + '. The Moon is down by then, so the sky stays dark.';
    const radPart = d.best.radAlt < 5 ? 'The meteors would start below the horizon, so few are visible.' : 'They seem to start ' + Math.round(d.best.radAlt) + '° up in the ' + WF_dir(d.best.radAz) + ' sky.';
    function WF_dir(az) { return window.WF.dirName(az); }
    const nd = d.sh.night;
    return Object.assign(base, {
      name: d.name, when: d.label.replace('Night of ', '') + ' · ' + d.inTxt,
      verdict: d.verdict, score: d.score, verdictWords: words, tone: tone,
      timeLabel: labels[t], rate: Math.round(cur.rate),
      arcPath: path, areaPath: path + ' L' + X(5) + ' 88 L' + X(0) + ' 88 Z', dotG: 'transform:translate(' + X(t).toFixed(1) + 'px,88px);transition:transform .6s var(--ease-out)', dotLine: 'transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(' + Math.max(0.001, (88 - Y(cur.radAlt)) / 88).toFixed(3) + ');transition:transform .6s var(--ease-out)', dotC: 'transform:translate(' + X(t).toFixed(1) + 'px,' + Y(cur.radAlt).toFixed(1) + 'px);transition:transform .6s var(--ease-out)',
      pillStyle: 'position:absolute;left:0;top:0;bottom:0;width:calc((100% - 30px) / 6);border-radius:22px;background:var(--wf-select);box-shadow:0 0 24px rgba(190,205,255,.25);transform:translateX(calc(' + t + ' * (100% + 6px)));transition:transform .55s var(--ease-spring);pointer-events:none',
      hours: labels.map((l, i) => ({
        label: l, on: i === t, pick: () => { this.setState({ t: i }); setTimeout(() => this.pushMoon(), 0); },
        style: 'position:relative;min-height:44px;border-radius:22px;font-size:12px;font-weight:500;padding:0;transition:color .3s var(--ease-out),border-color .3s var(--ease-out),background-color .3s var(--ease-out),transform .25s var(--ease-spring);color:' + (i === t ? 'var(--wf-select-ink)' : 'var(--wf-ink-2)') + ';border:1px solid ' + (i === t ? 'transparent' : 'rgba(255,255,255,.16)') + ';background:' + (i === t ? 'transparent' : 'rgba(255,255,255,.07)')
      })),
      t1l: cur.moonUp ? 'Moon lit' : 'Moon', t1v: cur.moonUp ? Math.round(cur.ill * 100) + '%' : 'Down',
      t2v: cur.radAlt > 70 ? 'Up' : ab(cur.radAz), t3v: Math.max(0, Math.round(cur.radAlt)) + '°',
      why: moonPart + ' ' + radPart,
      alertDay: nd[2] + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][nd[1] - 1]
    });
  }
}
</script>
</body>
</html>
