name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Put the design pages inside the app
        run: |
          mkdir -p app/www
          rsync -a --exclude app --exclude .github --exclude .git --exclude tools --exclude store --exclude privacy.html ./ app/www/
      - name: Install packages
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
      - uses: actions/upload-artifact@v4
        with:
          name: wishfall-apk
          path: app/android/app/build/outputs/apk/release/*.apk
