name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Put the design pages inside the app
        run: |
          mkdir -p app/www
          rsync -a --exclude app --exclude .github --exclude .git --exclude tools --exclude store --exclude privacy.html ./ app/www/
      - name: Install packages
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Create the Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Build the APK
        working-directory: app/android
        run: |
          # build; if a download hiccups, wait and try once more; show the real error if it still fails
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee /tmp/g1.log || true
          if ! ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            sleep 30
            ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" 2>&1 | tee /tmp/g2.log || true
          fi
          if ! ls app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then
            grep -E "What went wrong|Caused by|error:|Execution failed|Could not|> " -A4 /tmp/g2.log | grep -v "^--$" | head -40 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wishfall-apk
          path: app/android/app/build/outputs/apk/release/*.apk
  smoke:
    # opens the built APK on a real Android emulator and checks the screens appear (Tonight, Events, Sky, back button)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wishfall-apk
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_4
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/smoke.sh
