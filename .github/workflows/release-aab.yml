name: Release for Google Play
# Run by hand: Actions tab > "Release for Google Play" > Run workflow.
# Builds the signed bundle (.aab) that you upload to Google Play, with the pages inside the app (no web loading).
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Android app id (permanent once uploaded to Play)'
        default: 'app.wishfall'
      version_code:
        description: 'Version number, must go up by 1 on every upload to Play'
        default: '1'
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Put the design pages inside the app
        run: |
          mkdir -p app/www
          rsync -a --exclude app --exclude .github --exclude .git --exclude privacy.html --exclude tools --exclude store ./ app/www/
          rm -f app/www/sw.js
      - name: Switch the app from test mode to the real release
        working-directory: app
        run: |
          sed -i "s#^const TEST_URL = .*#const TEST_URL = '';#" App.js
          grep -n "^const TEST_URL" App.js
          sed -i "s#package:app.wishfall.test#package:${{ inputs.package }}#" App.js
          grep -n "^const PKG" App.js
          cd ..
          python3 tools/set_package.py "${{ inputs.package }}" "${{ inputs.version_code }}"
      - name: Install packages
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Create the Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Sign with your upload key
        working-directory: app/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          test -n "$KS_B64" || { echo "Secret ANDROID_KEYSTORE_B64 is missing"; exit 1; }
          echo "$KS_B64" | base64 -d > app/upload.jks
          cd ../..
          python3 tools/sign_gradle.py
      - name: Build the bundle and a test APK
        working-directory: app/android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: wishfall-upload
        run: ./gradlew bundleRelease assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
      - uses: actions/upload-artifact@v4
        with:
          name: wishfall-play-bundle
          path: |
            app/android/app/build/outputs/bundle/release/*.aab
            app/android/app/build/outputs/apk/release/*.apk
