name: Fetch star data
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download HYG v4.1 and keep stars brighter than mag 6.5
        run: |
          mkdir -p tools/data
          # find the newest HYG file in the repository (the path changes between versions)
          H="Authorization: Bearer ${{ github.token }}"
          BR=$(curl -sSf https://api.github.com/repos/astronexus/HYG-Database -H "$H" | python3 -c "import json,sys; print(json.load(sys.stdin)['default_branch'])")
          curl -sSf "https://api.github.com/repos/astronexus/HYG-Database/git/trees/$BR?recursive=1" -H "$H" > /tmp/tree.json
          python3 -c "import json; t=[x['path'] for x in json.load(open('/tmp/tree.json'))['tree'] if x['type']=='blob']; [print('::notice::F '+p) for p in t if p.endswith(('.csv','.gz','.zip'))][:0]"
          P=$(python3 -c "
          import json,re
          t=[x['path'] for x in json.load(open('/tmp/tree.json'))['tree'] if x['type']=='blob']
          c=[p for p in t if re.search(r'hyg[^/]*\.csv(\.gz)?$',p,re.I) and 'athyg' not in p.lower() and 'v3' not in p]
          c.sort(key=lambda p:(('CURRENT' in p), p))
          print(c[-1] if c else '')")
          echo "::notice::HYG branch $BR path: $P"
          curl -sSfL -o /tmp/hyg.raw "https://raw.githubusercontent.com/astronexus/HYG-Database/$BR/$P"
          case "$P" in *.gz) mv /tmp/hyg.raw /tmp/hyg.csv.gz ;; *) gzip -c /tmp/hyg.raw > /tmp/hyg.csv.gz ;; esac
          python3 - <<'PY'
          import csv,gzip
          r=csv.DictReader(gzip.open('/tmp/hyg.csv.gz','rt'))
          keep=['hip','proper','ra','dec','dist','mag','spect','ci','bayer','flam','con','lum']
          w=csv.writer(open('tools/data/hyg_bright.csv','w',newline=''))
          w.writerow(keep); n=0
          for x in r:
              try: m=float(x['mag'])
              except: continue
              if m<=6.5 and x['id']!='0': w.writerow([x.get(k,'') for k in keep]); n+=1
          print('kept',n)
          PY
      - name: Commit to the data branch
        run: |
          git config user.name "Arpit"; git config user.email "thesnapseven@gmail.com"
          git checkout -b data
          git add -f tools/data/hyg_bright.csv
          git commit -m "HYG star data (CC BY-SA 4.0, astronexus)"
          git push -f origin data
